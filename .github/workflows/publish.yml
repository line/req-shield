name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      target:
        description: Publication target
        required: true
        default: dev
        type: choice
        options:
          - dev
          - release

concurrency:
  group: publish-${{ inputs.target }}
  # A release that is cancelled between the publication and the pushes would leave Maven Central without its tag.
  cancel-in-progress: ${{ inputs.target != 'release' }}

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:6.2.7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Allow a release from the default branch only
        if: inputs.target == 'release' && github.ref_name != github.event.repository.default_branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "::error::Run the release target on the branch '$DEFAULT_BRANCH', not on '$GITHUB_REF_NAME'."
          exit 1

      - name: Create a token of the release app
        id: app-token
        if: inputs.target == 'release'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # A release pushes the tag and the version commit and creates the GitHub release with the app token.
          # The app may bypass the pull request rule of the default branch.
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set snapshot version
        if: inputs.target == 'dev'
        run: sed -i 's/snapshotBuild=false/snapshotBuild=true/' gradle.properties

      - name: Set release version
        if: inputs.target == 'release'
        run: sed -i 's/snapshotBuild=true/snapshotBuild=false/' gradle.properties

      # build.gradle.kts holds the version of the next release. A release publishes that version as it is.
      - name: Read the version and stop if its tag exists
        id: version
        if: inputs.target == 'release'
        run: |
          version="$(bash .github/scripts/read-version.sh build.gradle.kts)"
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::The tag $tag exists already, so version $version was released before."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build with Gradle
        run: ./gradlew build
        env:
          TEST_REDIS_HOST: localhost
          TEST_REDIS_PORT: 6379

      - name: Publish Dev Snapshot to Sonatype
        if: inputs.target == 'dev'
        run: ./gradlew --max-workers=1 publishToSonatype
        env:
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.GPG_SECRET_KEY_ID }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_SECRET_PASSWORD }}

      - name: Publish Release to Maven Central
        if: inputs.target == 'release'
        run: ./gradlew --max-workers=1 publishToSonatype closeAndReleaseSonatypeRepository
        env:
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.GPG_SECRET_KEY_ID }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_SECRET_PASSWORD }}

      # The tag points at the commit of this run, which is the source of the published artifacts.
      - name: Push the tag
        if: inputs.target == 'release'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          if ! git push origin "refs/tags/$TAG"; then
            echo "::error::${TAG#v} is on Maven Central, but the tag $TAG was not pushed. Create the tag on $GITHUB_SHA, create the release and raise the version in build.gradle.kts by hand."
            exit 1
          fi

      - name: Create the GitHub release with generated notes
        if: inputs.target == 'release'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes

      # This is the last step, so the default branch holds the released version until the release is complete.
      # The rebase keeps the push possible when the branch got other commits during this run.
      # --autostash keeps the changes that earlier steps made to other files out of the way.
      - name: Raise the minor version for the next release and push the commit
        if: inputs.target == 'release'
        run: |
          next="$(bash .github/scripts/bump-minor-version.sh build.gradle.kts)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "Set the version of the next release to $next" -- build.gradle.kts
          if ! { git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; }; then
            echo "::error::The release is complete, but the version commit was not pushed. Set the version in build.gradle.kts to $next by hand."
            exit 1
          fi

      - name: Cleanup Gradle Cache
        if: always()
        run: |
          rm -f ~/.gradle/caches/modules-2/modules-2.lock
          rm -f ~/.gradle/caches/modules-2/gc.properties
