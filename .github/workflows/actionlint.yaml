name: GitHub Actions Lint
on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"

concurrency:
  group: actionlint-${{ github.event.pull_request.number || github.sha }}

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: reviewdog / actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_on_error: true

  scripts:
    name: Test Workflow Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Test the version bump script
        run: bash .github/scripts/bump-minor-version.test.sh
