name: Lint
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".github/**"

concurrency:
  group: lint-${{ github.event.pull_request.number || github.sha }}

permissions:
  contents: read

jobs:
  ktlint:
    name: Check Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      # The ktlint Gradle plugin of the build checks every module with the same rules as a local build.
      # It needs no write permission, unlike a reviewdog reporter, which failed to post to the Checks API.
      - name: ktlint
        run: ./gradlew ktlintCheck
